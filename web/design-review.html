<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차근차근 반응형 검수</title><style>body{margin:0;padding:16px;background:#e8ece3;font:16px system-ui;color:#264536}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}button,select{font:inherit;padding:12px;border:1px solid #9fb292;background:#fcfdf6;border-radius:10px}iframe{display:block;margin:auto;background:#f7f6f0;border:1px solid #acbda0;border-radius:16px;width:390px;height:780px}p{margin:0}</style></head><body><header><p>가상자료 · 화면 폭 검수</p><button data-width="390">휴대폰 390px</button><button data-width="820">태블릿 820px</button><select aria-label="확인할 화면"><option value="index.html">처음</option><option value="routine.html">나의 하루</option><option value="emotion.html">마음 전하기</option><option value="aac.html">말로 전하기</option><option value="daily-skills.html">생활 연습</option><option value="rest-space.html">쉬어 가기</option><option value="teacher.html">교사 화면</option></select></header><iframe title="화면 검수" src="index.html"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+'px');document.querySelector('select').onchange=e=>frame.src=e.target.value;</script></body></html>

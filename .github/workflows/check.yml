name: Check classroom demo
on:
  pull_request:
  push:
    branches: [main, 'docs/special-education-additions-20261009']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
